name: Offline sandbox tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (stdlib only)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser-independent logic tests
        run: node --test experiments/minidesk/tests/*.test.mjs
