<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MiniDesk — مختبر Jules</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Jules Autonomous Lab 001</p>
      <h1>MiniDesk</h1>
      <p class="lead">قائمة تجريبية محلية — لا ترسل أي بيانات إلى الإنترنت.</p>
    </header>
    <section class="panel" aria-labelledby="heading-new">
      <h2 id="heading-new">إضافة مهمة</h2>
      <form id="task-form">
        <label for="task-title">وصف المهمة</label>
        <div class="input-row">
          <input id="task-title" type="text" maxlength="120" required placeholder="مثال: اختبار ميزة جديدة" autocomplete="off">
          <button type="submit">إضافة</button>
        </div>
      </form>
    </section>
    <section class="panel" aria-labelledby="heading-tasks">
      <div class="section-heading">
        <h2 id="heading-tasks">المهام</h2>
        <output id="counts" aria-live="polite">0 مهمة</output>
      </div>
      <ul id="task-list" aria-label="قائمة المهام"></ul>
      <p id="empty-state">لم تُضف مهام بعد.</p>
    </section>
    <footer>هذا نموذج اختباري مستقل للاستخدام المحلي فقط.</footer>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
